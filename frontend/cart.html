<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eshop - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== HEADER (Gaya ng ibang pages) ===== -->
    <header class="site-header">
        <div class="brand">
            <img src="assets/AIrobot.png" alt="Eshop Logo" width="30">
            <span class="company-name">Eshop</span>
        </div>
        <nav id="mainNav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="actions">
            <a href="cart.html" class="cart-link">
                <img src="assets/cartwhite.svg" alt="Cart" width="28">
                <span class="cart-badge" id="cartBadge">3</span>
            </a>
            <button class="hamburger" onclick="toggleMenu()">
                <img src="assets/hamburgerwhite.svg" alt="Menu" width="28">
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT (Cart Table) ===== -->
   <main>
    <section class="hero">
        <h1>Shopping Cart</h1>
        <p>Review your items before checkout.</p>
    </section>
    <section class="cart-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartItems">
                <!-- Dynamic rows here -->
            </tbody>
        </table>
        <div class="cart-summary">
            <h3>Grand Total: <span id="grandTotal">₱0.00</span></h3>
            <button id="buyButton" class="buy-btn">🛒 Buy Now</button>
        </div>
    </section>
</main>
    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
        <p>&copy; 2026 Eshop. All rights reserved.</p>
    </footer>

    <!-- ===== JAVASCRIPT (Cart specific) ===== -->
    <script src="main.js"></script>  <!-- For hamburger toggle -->
    <script src="cart.js"></script>   <!-- NEW: Cart logic -->
</body>
</html>
