<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eshop - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="brand">
            <img src="assets/logo.svg" alt="Eshop Logo" width="30">
            <span class="company-name">Eshop</span>
        </div>
        <nav id="mainNav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="actions">
            <a href="cart.html" class="cart-link">
                <img src="assets/cart.svg" alt="Cart" width="28">
                <span class="cart-badge">3</span>
            </a>
            <button class="hamburger" onclick="toggleMenu()">
                <img src="assets/menu.svg" alt="Menu" width="28">
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT (Contact Form) ===== -->
    <main>
    <section class="hero">
        <h1>Contact Us</h1>
        <p>May tanong o kailangan ng tulong? Punan lang ang form sa baba.</p>
    </section>
    <section class="contact-form">
        <form>
            <div class="form-group">
                <label for="name">Buong Pangalan:</label>
                <input type="text" id="name" placeholder="Juan Dela Cruz">
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="juan@example.com">
            </div>
            <div class="form-group">
                <label for="message">Mensahe:</label>
                <textarea id="message" rows="5" placeholder="Ilagay ang iyong katanungan..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Ipadala</button>
        </form>
    </section>
</main>
    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
        <p>&copy; 2026 Eshop. All rights reserved.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
